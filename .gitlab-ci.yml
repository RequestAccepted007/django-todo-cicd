stages:
  - build
  - test
  - push_to_dockerhub
  - deploy

variables:
  DOCKER_IMAGE: node-app:latest

build_job:
  stage: build
  script: 
    - docker build -t $DOCKER_IMAGE .    # Fixed typo: DOCKER_IAMGE -> DOCKER_IMAGE
    - docker ps -a
    - docker images
  tags:
    - dev

test_job:
  stage: test
  script: 
    - echo "testing ..."
  tags:
    - dev

push_job:
  stage: push_to_dockerhub
  script: 
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_PASS"    # Added quotes around variables
    - docker tag $DOCKER_IMAGE $DOCKERHUB_USER/$DOCKER_IMAGE    # Simplified 'docker image tag' to 'docker tag'
    - docker push $DOCKERHUB_USER/$DOCKER_IMAGE
  tags: 
    - dev

deploy_job:
  stage: deploy
  script: 
    - docker-compose up -d    # Fixed typo: docker compose -> docker-compose
  tags: 
    - dev
